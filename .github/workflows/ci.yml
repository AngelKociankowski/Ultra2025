name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # better-sqlite3 se compila en la instalación; sin --include=dev falla el build.
      - run: npm ci

      - run: npm run build

      # Las pruebas levantan la app contra una base desechable, así que
      # necesitan el build hecho arriba.
      #
      # DIAGNÓSTICO TEMPORAL. El log completo de Actions vive en un almacén que
      # no todas las herramientas alcanzan, así que cuando la suite falla se
      # publican las pruebas rojas como anotación del trabajo, que sí se lee por
      # API. Se quita en cuanto esté localizado el fallo que no se reproduce
      # fuera del corredor.
      - run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/pruebas.txt || {
            resumen=$(grep -E '^# (tests|pass|fail)' /tmp/pruebas.txt | tr '\n' ' ')
            echo "::error::RESUMEN $resumen"
            grep -E '^not ok' /tmp/pruebas.txt | head -8 | while IFS= read -r linea; do
              echo "::error::$linea"
            done
            grep -E 'Error|error:' /tmp/pruebas.txt | grep -v cancelledByParent | head -4 |
              while IFS= read -r linea; do echo "::error::CAUSA $linea"; done
            exit 1
          }
