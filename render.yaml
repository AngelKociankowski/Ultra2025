# Receta de instalación para Render.
#
# Con este archivo en el repositorio, Render no pregunta casi nada: lee de aquí
# qué construir, cómo arrancar y —lo más importante— que necesita un disco que
# no se borre entre actualizaciones. Ahí vive la base de datos.
#
# Si algún día se cambia de proveedor, el Dockerfile de al lado sirve para
# cualquier otro (Railway, Fly, un servidor propio).

services:
  - type: web
    name: ultra-guardias
    runtime: node
    # Tiene que ser un plan de paga: los gratuitos no admiten disco y se
    # duermen solos, y una plataforma de trabajo no puede tardar un minuto en
    # despertar cuando alguien entra a capturar.
    #
    # `standard` (1 CPU, 2 GB) y no `starter`: es el que el director tiene
    # puesto en el panel. Este archivo decía `starter` y nadie lo notó hasta el
    # 13 de noviembre de 2026: se cambió aquí el tamaño del disco, Render volvió
    # a aplicar el archivo ENTERO, bajó el plan a 512 MB y la plataforma no
    # arrancó. Estuvo caída hasta que se devolvió el plan a mano.
    #
    # La lección vale para todo el archivo: Render no aplica la línea que
    # cambiaste, aplica todas. Lo que diga aquí tiene que ser verdad en el
    # panel ANTES de tocar cualquier otra cosa.
    plan: standard
    region: oregon
    # La rama va escrita, y es `main`. Sin ella Render usa la rama con la que se
    # conectó el plano, que es la de trabajo: en esa misma caída producción quedó
    # escuchando la rama de trabajo, donde cualquier cambio a medias se habría
    # desplegado solo. Producción solo cambia cuando algo se mergea a `main`.
    branch: main

    buildCommand: npm ci && npm run build

    # La siembra corre en cada arranque a propósito: la primera vez carga el
    # Estado de Fuerza y crea al administrador; de ahí en adelante ve que la
    # base ya tiene servicios y no toca nada. Así una actualización nunca
    # puede borrar la operación.
    startCommand: node scripts/seed.mjs && npm run start

    healthCheckPath: /login

    # Diez gigas, y tiene que coincidir con lo que diga el panel de Render.
    # Nació con uno y se llenó: la base, los PDF y los respaldos comparten este
    # disco, y un solo respaldo completo pesa lo que todos los PDF juntos. El
    # director lo agrandó a mano desde el panel el 13 de noviembre de 2026.
    # Render solo deja agrandar un disco, nunca achicarlo: este número no baja.
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 10

    envVars:
      - key: DATABASE_PATH
        value: /var/data/ultra.db
      - key: NODE_VERSION
        value: "20"
      # Se pide al instalar y no se guarda en el repositorio: es la contraseña
      # prestada con la que el administrador entra la primera vez.
      - key: SEED_PASSWORD
        sync: false
